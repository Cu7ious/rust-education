name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edurust
          POSTGRES_PASSWORD: edurust
          POSTGRES_DB: edurust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edurust -d edurust"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://edurust:edurust@localhost:5432/edurust
      TEST_DATABASE_URL: postgres://edurust:edurust@localhost:5432/edurust_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
      - name: Check formatting
        working-directory: api
        run: cargo fmt --all --check
      - name: Apply migrations
        working-directory: api
        run: sqlx migrate run
      - name: Clippy
        working-directory: api
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-targets -- -D warnings
      - name: Check SQLx offline data
        working-directory: api
        run: cargo sqlx prepare --check
      - name: Test
        working-directory: api
        env:
          SQLX_OFFLINE: "true"
        run: cargo test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Format
        working-directory: web
        run: npm run format:check
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
