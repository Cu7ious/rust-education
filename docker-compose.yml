services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: edurust
      POSTGRES_PASSWORD: edurust
      POSTGRES_DB: edurust
    ports:
      - "5432:5432"
    volumes:
      - edurust-pg:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/02-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edurust -d edurust"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  edurust-pg:
